services:
  - type: web
    name: frame-extractor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker + threads keeps memory low on the 512 MB free tier.
    # Long timeout because extraction happens during the request.
    startCommand: gunicorn app:app --workers 1 --threads 2 --timeout 300 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: MAX_UPLOAD_MB
        value: "100"
      - key: MAX_FRAMES
        value: "1000"
